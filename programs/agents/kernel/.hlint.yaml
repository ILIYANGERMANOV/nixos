# state.cabal's language and default-extensions again: hlint 3.10 does not read a
# .cabal file, and without OverloadedRecordDot it parses `(cfg m).fuel` as a
# composition and calls the brackets redundant. Keep the two lists in step.
- arguments:
    - -XGHC2024
    - -XDataKinds
    - -XDuplicateRecordFields
    - -XLambdaCase
    - -XNoFieldSelectors
    - -XOverloadedLabels
    - -XOverloadedRecordDot
    - -XOverloadedStrings
    - -XTypeApplications
    - -XTypeFamilies

- ignore: {name: "Use <&>"}
- ignore: {name: "Redundant id"}
