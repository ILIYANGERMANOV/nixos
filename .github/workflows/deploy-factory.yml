name: Deploy software factories

# Requests a deploy of main's tip to one software factory, or to all of them,
# from the Actions tab or with `factory-ctl deploy` on a factory (its own host).
# Each factory polls for the deployment of the environment named after it and
# builds it itself, so GitHub holds no credential to a server.
#
# The `if:` below is a convenience, not the boundary: a branch can carry its own
# copy of this file, and anyone with write access can create a deployment
# through the API. The server checks that the commit is main's tip before it
# builds anything. See docs/adr/0007-software-factory.md.

# The host options and FACTORIES below are `factories` in flake.nix:
# checks.factory-deploy-hosts fails when either drifts from it.
on:
  workflow_dispatch:
    inputs:
      host:
        description: The factory to deploy, or all of them
        type: choice
        default: all
        options:
          - all
          - software-factory
          - software-factory-lenovo

permissions:
  checks: read
  deployments: write

concurrency:
  group: deploy-factory
  cancel-in-progress: false

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORIES: software-factory software-factory-lenovo
    steps:
      # The jobs of check.yml that gate a deploy. It runs on every push to main.
      - name: Require green CI on this commit
        run: |
          conclusions=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "check" or .name == "cache-guard-aarch64-darwin" or .name == "cache-guard-x86_64-linux" or .name == "checks-x86_64") | "\(.name)=\(.conclusion)"] | sort | join(" ")')
          echo "CI on $GITHUB_SHA: ${conclusions:-none}"
          [ "$conclusions" = "cache-guard-aarch64-darwin=success cache-guard-x86_64-linux=success check=success checks-x86_64=success" ] || {
            echo "::error::CI has not passed on $GITHUB_SHA yet. Wait for it, or fix main."
            exit 1
          }

      # One deployment per factory, for the environment named after its host.
      # required_contexts is empty because the step above already checked CI,
      # and GitHub would otherwise demand every status on the commit.
      - name: Create the deployments
        env:
          HOST: ${{ inputs.host }}
        run: |
          case "$HOST" in
            all) hosts=$FACTORIES ;;
            *) hosts=$HOST ;;
          esac
          for host in $hosts; do
            jq -n --arg ref "$GITHUB_SHA" --arg environment "$host" --arg actor "$GITHUB_ACTOR" \
              '{ref: $ref, environment: $environment, description: "Requested by \($actor)", auto_merge: false, required_contexts: []}' |
              gh api "repos/$GITHUB_REPOSITORY/deployments" --input -
            echo "Requested a deploy of $GITHUB_SHA to $host. It picks it up within a minute."
          done
