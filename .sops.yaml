creation_rules:
  # Each software factory has an age key of its own, so a compromise of one
  # server reveals its own secrets and nothing else. sops uses the first rule
  # that matches, so these must stay above the catch-all. A factory's key is
  # added by `just factory-generate-age-key <host>`, which replaces its marker
  # line.
  - path_regex: secrets/hosts/software-factory\.yaml$
    key_groups:
      - age:
          - age1fz8wfwqx8s6ucnsn7l0a32yp6avnaqy6vz8j4xy8ye9udgyy6urq09lfxt
          - age1r0e3udkr7xqhskf68h48hkwavrwkdl9rg9q6urxeqg5j59zvjq4smxq906 # software-factory
  - path_regex: secrets/hosts/software-factory-lenovo\.yaml$
    key_groups:
      - age:
          - age1fz8wfwqx8s6ucnsn7l0a32yp6avnaqy6vz8j4xy8ye9udgyy6urq09lfxt
          # software-factory-lenovo-age-key: not generated yet
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - age1fz8wfwqx8s6ucnsn7l0a32yp6avnaqy6vz8j4xy8ye9udgyy6urq09lfxt
