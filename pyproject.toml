# Tool config only: ruff, basedpyright and pytest for every .py in this repository.
# No Python package lives here, and every script stays stdlib-only: pytest and
# hypothesis exist only inside the checks. Enforced by `just tech python`; see
# docs/adr/0009-tech-checks.md.
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "DTZ", "E", "ERA", "F", "FBT",
  "FURB", "G", "I", "ISC", "LOG", "N", "PERF", "PIE", "PL", "PTH", "RET", "RUF",
  "S", "SIM", "SLF", "T10", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
  "E501",   # The formatter owns width.
  "ISC001", # Conflicts with the formatter.
  "TRY003", # A short message at the raise beats an exception class per message.
]

[tool.ruff.lint.per-file-ignores]
# The only ones that call subprocess, always with an argv list. The guard's git and
# the parser's shfmt are substituted at build time; a test runs what the check puts
# on PATH, disk_plan.py what factory-ctl does, ctx.py the agent session's and
# analyze.py the person's gh.
"programs/claude-code/hooks/read-guard/read-guard.py" = ["S603", "S607"]
"programs/claude-code/hooks/shared/bash_commands.py" = ["S603"]
"programs/claude-code/hooks/shared/guard_harness.py" = ["S603"]
"programs/claude-code/statusline/statusline.py" = ["S603", "S607"]
"programs/software-factory/disk_plan.py" = ["S603", "S607"]
"just/cache-check/cache_check.py" = ["S603", "S607"]
"programs/mutation/mutation_diff.py" = ["S603", "S607"]
"programs/agents/ctx/ctx.py" = ["S603", "S607"]
"programs/agents/state/effects.py" = ["S603", "S607"]
# The state hooks run the session's `ctx`.
"programs/agents/state/hook.py" = ["S603", "S607"]
# The dispatcher runs each hook's argv as declared in Nix.
"programs/agents/hooks/agent_hook.py" = ["S603"]
"programs/agents/skills/custom/self-improve/scripts/analyze.py" = ["S603", "S607"]
# The state tests' shared helper asserts and runs git, as a test does.
"programs/agents/state/state_fixtures.py" = ["S101", "S603", "S607"]
"**/test_*.py" = ["S101", "S603", "S607", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.system".msg = "Use subprocess.run with an argv list."

[tool.pytest.ini_options]
# A companion test keeps its script's literal name, hyphens included, which only
# importlib can import. The seed keeps hypothesis the same on every run.
addopts = "--import-mode=importlib -p no:cacheprovider --hypothesis-seed=0 -q"
# A test imports what sits beside it: the harness, bash_commands.py, disk_plan.py,
# cache_check.py. The analyzer's differential test imports both programs.
pythonpath = [
  "programs/claude-code/hooks/shared",
  "programs/claude-code/statusline",
  "programs/agents/skills/custom/self-improve/scripts",
  "programs/software-factory",
  "just/cache-check",
  "programs/mutation",
  "programs/agents/ctx",
  # The hook contract, and Claude's adapter, which imports it as it does at run time.
  "programs/agents/hooks",
  "programs/claude-code/hooks/adapter",
  # `state` is a package, imported as `state.core`: its modules' bare names
  # (core, cli, main) would clash with any other module on this shared path.
  "programs/agents",
]
testpaths = ["programs", "just"]

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.13"

# The adapter imports the hook contract from site-packages at runtime
# (adapter.nix). First: the guards' environment below would claim it.
[[tool.basedpyright.executionEnvironments]]
root = "programs/claude-code/hooks/adapter"
extraPaths = ["programs/agents/hooks"]

# The guards import their sibling modules from site-packages at runtime
# (bash-guard.nix), so they are absolute imports, not relative ones.
[[tool.basedpyright.executionEnvironments]]
root = "programs/claude-code/hooks"
extraPaths = ["programs/claude-code/hooks/shared"]

[[tool.basedpyright.executionEnvironments]]
root = "programs/claude-code/statusline"

[[tool.basedpyright.executionEnvironments]]
root = "programs/agents/skills/custom/self-improve/scripts"
extraPaths = ["programs/claude-code/hooks/shared"]

[[tool.basedpyright.executionEnvironments]]
root = "programs/software-factory"

[[tool.basedpyright.executionEnvironments]]
root = "just/cache-check"

[[tool.basedpyright.executionEnvironments]]
root = "programs/mutation"

[[tool.basedpyright.executionEnvironments]]
root = "programs/agents/ctx"

[[tool.basedpyright.executionEnvironments]]
root = "programs/agents/hooks"

[[tool.basedpyright.executionEnvironments]]
root = "programs/agents/state"
# hook.py imports the hook contract from site-packages at runtime (default.nix).
extraPaths = ["programs/agents", "programs/agents/hooks"]
